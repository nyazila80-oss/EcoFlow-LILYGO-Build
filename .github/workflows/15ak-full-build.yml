name: 15AK TLS Peak Attribution Full Build
on:
  push:
    branches: ["diag/15ak-tls-peak-attribution"]
  workflow_dispatch:

jobs:
  full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Provenance
        run: |
          echo "15AK_HEAD=$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet
          git log -1 --oneline
      - name: Python syntax gate
        run: python -m compileall -q tools
      - name: Install PlatformIO
        run: pip install platformio
      - name: Bootstrap pinned packages
        run: pio pkg install -e lilygo_tcan485
      - name: Existing audits and host simulations
        run: |
          set -euo pipefail
          for f in tools/host_sim_*.py tools/audit_*.py; do
            echo "===== 15AK RUN $f ====="
            python "$f"
          done
      - name: Full clean
        run: |
          rm -rf .pio/build .pio/libdeps
          git reset --hard "$GITHUB_SHA"
          git clean -fd src
          git diff --quiet
          git diff --cached --quiet
      - name: Build USB from pristine source
        run: |
          set -euo pipefail
          git reset --hard "$GITHUB_SHA"
          git clean -fd src
          rm -rf .pio/build/lilygo_tcan485
          pio run -e lilygo_tcan485
      - name: Restore pristine source after USB pre-scripts
        run: |
          git reset --hard "$GITHUB_SHA"
          git clean -fd src
          git diff --quiet
          git diff --cached --quiet
      - name: Build OTA from pristine source
        run: |
          set -euo pipefail
          rm -rf .pio/build/lilygo_tcan485_ota
          pio run -e lilygo_tcan485_ota
      - name: Restore pristine source after OTA pre-scripts
        run: |
          git reset --hard "$GITHUB_SHA"
          git clean -fd src
      - name: Build SPIFFS OTA
        run: pio run -e lilygo_tcan485_ota -t buildfs
      - name: 15AK diagnostic and security gates
        run: |
          set -euo pipefail
          git reset --hard "$GITHUB_SHA"
          git clean -fd src
          python - <<'PY'
          from pathlib import Path
          import re
          ini=Path('platformio.ini').read_text()
          d=Path('tools/platformio_tls15ak_peak_attribution.py').read_text()
          ag=Path('tools/platformio_tls15ag_peak_fix.py').read_text()
          src=Path('src/powerstream_api.cpp').read_text()
          assert 'pre:tools/platformio_tls15ag_peak_fix.py' in ini
          assert 'pre:tools/platformio_tls15ak_peak_attribution.py' in ini
          # 32768 is deliberately a generated-source invariant introduced by 15AG,
          # not a literal in the pristine canonical powerstream_api.cpp.
          assert "new_thr='static constexpr uint32_t TLS_GET_MIN_LARGEST8 = 32768;'" in ag
          assert "if p.count(new_thr)!=1" in ag
          assert 'client.setCACert(ECOFLOW_CA_BUNDLE);' in src
          code=re.sub(r'//[^\n]*|/\*.*?\*/','',src,flags=re.S)
          assert not re.search(r'\bsetInsecure\s*\(',code)
          assert 'MBEDTLS_SSL_VERIFY_NONE' not in code
          assert 'g15akFirstSize' in d and 'g15akLastSize' in d
          assert 'g15akMinLargest' in d
          print('15AK SOURCE/SECURITY GATES PASS')
          PY
      - name: Rebuild OTA pristine and collect original names
        run: |
          set -euo pipefail
          git reset --hard "$GITHUB_SHA"
          git clean -fd src
          rm -rf .pio/build/lilygo_tcan485_ota
          pio run -e lilygo_tcan485_ota
          git reset --hard "$GITHUB_SHA"
          git clean -fd src
          pio run -e lilygo_tcan485_ota -t buildfs
          mkdir -p artifacts
          cp .pio/build/lilygo_tcan485_ota/firmware.bin artifacts/firmware.bin
          cp .pio/build/lilygo_tcan485_ota/spiffs.bin artifacts/spiffs.bin
          sha256sum artifacts/firmware.bin artifacts/spiffs.bin | tee artifacts/SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > artifacts/COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 15AK-tls-peak-original-files-${{ github.sha }}
          path: artifacts/
          retention-days: 14
