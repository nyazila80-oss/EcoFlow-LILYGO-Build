name: PlatformIO Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: PlatformIO version
        run: pio --version

      - name: Clean
        run: pio run -t clean

      - name: Build firmware - USB environment
        run: pio run -e lilygo_tcan485

      - name: Build firmware - OTA environment
        run: pio run -e lilygo_tcan485_ota

      - name: Build SPIFFS - USB environment
        run: pio run -e lilygo_tcan485 -t buildfs

      - name: Build SPIFFS - OTA environment
        run: pio run -e lilygo_tcan485_ota -t buildfs

      - name: Collect build artifacts
        if: success()
        run: |
          mkdir -p artifacts/lilygo_tcan485 artifacts/lilygo_tcan485_ota
          cp .pio/build/lilygo_tcan485/firmware.bin artifacts/lilygo_tcan485/
          cp .pio/build/lilygo_tcan485/spiffs.bin artifacts/lilygo_tcan485/
          cp .pio/build/lilygo_tcan485_ota/firmware.bin artifacts/lilygo_tcan485_ota/
          cp .pio/build/lilygo_tcan485_ota/spiffs.bin artifacts/lilygo_tcan485_ota/

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EcoFlow-LILYGO-build-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
