name: PlatformIO Build

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - 'fix/**'
      - 'diag/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: PlatformIO version
        run: pio --version

      - name: Bootstrap pinned PlatformIO project packages
        shell: bash
        run: |
          set -euo pipefail
          pio pkg install -e lilygo_tcan485
          PLATFORMIO_CORE_DIR="${PLATFORMIO_CORE_DIR:-$HOME/.platformio}"
          FRAMEWORK_DIR="$PLATFORMIO_CORE_DIR/packages/framework-arduinoespressif32"
          test -d "$FRAMEWORK_DIR/libraries/WiFiClientSecure/src"
          test -s "$FRAMEWORK_DIR/libraries/WiFiClientSecure/src/ssl_client.h"
          test -s "$FRAMEWORK_DIR/libraries/WiFiClientSecure/src/ssl_client.cpp"
          echo "15J bootstrap framework ready: $FRAMEWORK_DIR"

      - name: Apply 15D runtime diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_tls15d_runtime_patch.py
          grep -F 'cred_request_secret_match' src/powerstream_api.cpp
          grep -F 'tls_internal_get_post_largest' src/powerstream_api.cpp

      - name: 15F generated-source regression gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s = Path('src/powerstream_api.cpp').read_text(encoding='utf-8')
          required = [
              'String(gTlsInternalGetPostLargest.load())+',
              '\\"tls_failed_alloc_count\\":"+String(gTlsFailedAllocCount.load())',
              '\\"tls_failed_alloc_size\\":"+String(gTlsFailedAllocSize.load())',
              '\\"tls_failed_alloc_caps\\":"+String(gTlsFailedAllocCaps.load())',
              '\\"tls_failed_alloc_task\\":"+String(gTlsFailedAllocTask.load())',
              '\\"tls_failed_caps_free\\":"+String(gTlsFailedCapsFree.load())',
              '\\"tls_failed_caps_largest\\":"+String(gTlsFailedCapsLargest.load())',
              '\\"tls_failed_internal_free\\":"+String(gTlsFailedInternalFree.load())',
              '\\"tls_failed_internal_largest\\":"+String(gTlsFailedInternalLargest.load())',
              '\\"tls_failed_8bit_free\\":"+String(gTlsFailed8BitFree.load())',
              '\\"tls_failed_8bit_largest\\":"+String(gTlsFailed8BitLargest.load())',
              '\\"tls_failed_dma_free\\":"+String(gTlsFailedDmaFree.load())',
              '\\"tls_failed_dma_largest\\":"+String(gTlsFailedDmaLargest.load())',
              '\\"tls_failed_32bit_free\\":"+String(gTlsFailed32BitFree.load())',
              '\\"tls_failed_32bit_largest\\":"+String(gTlsFailed32BitLargest.load())',
              '\\"tls_alloc_hook_rc\\":"+String(gTlsAllocHookRc.load())',
              '\\"internal_free_pre\\":"+String(gTlsInternalFreePre.load())',
          ]
          positions=[]
          for token in required:
              pos=s.find(token)
              if pos < 0: raise SystemExit(f'missing generated 15F status token: {token}')
              positions.append(pos)
          if positions != sorted(positions): raise SystemExit('15F generated status fields are not in expected order')
          if 'heap_caps_get_largest_free_block(caps)' not in s: raise SystemExit('15F exact-cap largest probe missing')
          if 'heap_caps_get_largest_free_block(MALLOC_CAP_DMA)' not in s: raise SystemExit('15F DMA probe missing')
          print('15F generated-source regression gate PASS')
          PY

      - name: Dependency and configuration gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'platform = espressif32@7.1.3' platformio.ini
          grep -F 'esp32async/ESPAsyncWebServer @ 3.12.1' platformio.ini
          grep -F 'ESP32Async/AsyncTCP @ 3.5.0' platformio.ini
          grep -F 'knolleary/PubSubClient @ 2.8.0' platformio.ini
          grep -F 'h2zero/NimBLE-Arduino @ 2.5.1' platformio.ini
          grep -F 'board_build.filesystem = spiffs' platformio.ini
          grep -F 'board_build.partitions = partitions.csv' platformio.ini

      - name: SPIFFS firmware-version provenance gate
        shell: bash
        run: |
          set -euo pipefail
          test -s data/fs_version.txt
          FW_VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text=Path('include/config.h').read_text(encoding='utf-8')
          m=re.search(r'^\s*#define\s+FW_VERSION\s+"([^"]+)"\s*$',text,re.M)
          if not m: raise SystemExit('FW_VERSION not found uniquely in include/config.h')
          print(m.group(1))
          PY
          )"
          FS_VERSION="$(tr -d '\r\n' < data/fs_version.txt)"
          echo "Firmware version: $FW_VERSION"
          echo "SPIFFS manifest: $FS_VERSION"
          test -n "$FS_VERSION"
          if [ "$FW_VERSION" != "$FS_VERSION" ]; then echo 'ERROR: data/fs_version.txt does not match FW_VERSION.'; exit 1; fi

      - name: Repository secret hygiene gate
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E '(AccessKey|SecretKey)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_+/=-]{12,}' -- ':!*.md' ':!*.txt'; then echo 'Potential EcoFlow credential material found.'; exit 1; fi
          echo 'No obvious EcoFlow AccessKey/SecretKey assignment found in tracked source files.'

      - name: Python syntax gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' pyfiles < <(find . -type f -name '*.py' -not -path './.pio/*' -not -path './.git/*' -print0)
          if [ ${#pyfiles[@]} -gt 0 ]; then python -m py_compile "${pyfiles[@]}"; fi

      # Fast fail first: exercise the complete PlatformIO pre-script chain and compiler
      # before spending several minutes on the heavy host regression suite.
      - name: Clean
        run: pio run -t clean
      - name: Build firmware - USB environment
        run: pio run -e lilygo_tcan485
      - name: Build firmware - OTA environment
        run: pio run -e lilygo_tcan485_ota
      - name: Build SPIFFS - USB environment
        run: pio run -e lilygo_tcan485 -t buildfs
      - name: Build SPIFFS - OTA environment
        run: pio run -e lilygo_tcan485_ota -t buildfs

      - name: Host regression simulations
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t sims < <(find . -maxdepth 2 -type f \( -name 'host_sim*.py' -o -name '*regression*.py' -o -name '*audit*.py' \) -not -path './.pio/*' -not -path './.git/*' | sort)
          if [ ${#sims[@]} -eq 0 ]; then echo 'No host regression simulation scripts found; gate is informational.'; exit 0; fi
          printf 'Running %s host simulation/regression scripts\n' "${#sims[@]}"
          for sim in "${sims[@]}"; do echo "===== $sim ====="; python "$sim"; done

      - name: Release artifact gate
        shell: bash
        run: |
          set -euo pipefail
          FW_VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text=Path('include/config.h').read_text(encoding='utf-8')
          m=re.search(r'^\s*#define\s+FW_VERSION\s+"([^"]+)"\s*$',text,re.M)
          if not m: raise SystemExit('FW_VERSION not found uniquely in include/config.h')
          print(m.group(1))
          PY
          )"
          for env in lilygo_tcan485 lilygo_tcan485_ota; do
            for f in firmware.bin spiffs.bin bootloader.bin partitions.bin; do test -s ".pio/build/$env/$f"; echo "$env $f: $(stat -c%s ".pio/build/$env/$f") bytes"; done
            grep -aFq 'fs_version.txt' ".pio/build/$env/spiffs.bin" || exit 1
            grep -aFq "$FW_VERSION" ".pio/build/$env/spiffs.bin" || exit 1
          done
          cmp -s .pio/build/lilygo_tcan485/spiffs.bin .pio/build/lilygo_tcan485_ota/spiffs.bin || exit 1
          echo 'SPIFFS provenance OK.'

      - name: Collect build artifacts
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/lilygo_tcan485 artifacts/lilygo_tcan485_ota
          for env in lilygo_tcan485 lilygo_tcan485_ota; do
            cp ".pio/build/$env/firmware.bin" "artifacts/$env/"
            cp ".pio/build/$env/spiffs.bin" "artifacts/$env/"
            cp ".pio/build/$env/bootloader.bin" "artifacts/$env/"
            cp ".pio/build/$env/partitions.bin" "artifacts/$env/"
          done
          cp platformio.ini partitions.csv data/fs_version.txt artifacts/

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EcoFlow-LILYGO-build-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
