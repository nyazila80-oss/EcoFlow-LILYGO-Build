name: PlatformIO Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: PlatformIO version
        run: pio --version

      - name: Apply 15D runtime diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_tls15d_runtime_patch.py
          grep -F 'cred_request_secret_match' src/powerstream_api.cpp
          grep -F 'tls_internal_get_post_largest' src/powerstream_api.cpp

      - name: Dependency and configuration gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'platform = espressif32@7.1.3' platformio.ini
          grep -F 'esp32async/ESPAsyncWebServer @ 3.12.1' platformio.ini
          grep -F 'ESP32Async/AsyncTCP @ 3.5.0' platformio.ini
          grep -F 'knolleary/PubSubClient @ 2.8.0' platformio.ini
          grep -F 'h2zero/NimBLE-Arduino @ 2.5.1' platformio.ini
          grep -F 'board_build.filesystem = spiffs' platformio.ini
          grep -F 'board_build.partitions = partitions.csv' platformio.ini

      - name: SPIFFS firmware-version provenance gate
        shell: bash
        run: |
          set -euo pipefail
          test -s data/fs_version.txt
          FW_VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('include/config.h').read_text(encoding='utf-8')
          m = re.search(r'^\s*#define\s+FW_VERSION\s+"([^"]+)"\s*$', text, re.M)
          if not m:
              raise SystemExit('FW_VERSION not found uniquely in include/config.h')
          print(m.group(1))
          PY
          )"
          FS_VERSION="$(tr -d '\r\n' < data/fs_version.txt)"
          echo "Firmware version: $FW_VERSION"
          echo "SPIFFS manifest: $FS_VERSION"
          test -n "$FS_VERSION"
          if [ "$FW_VERSION" != "$FS_VERSION" ]; then
            echo "ERROR: data/fs_version.txt does not match FW_VERSION. Refusing to build a mismatched SPIFFS image."
            exit 1
          fi

      - name: Repository secret hygiene gate
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E '(AccessKey|SecretKey)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_+/=-]{12,}' -- ':!*.md' ':!*.txt'; then
            echo 'Potential EcoFlow credential material found in tracked source files.'
            exit 1
          fi
          echo 'No obvious EcoFlow AccessKey/SecretKey assignment found in tracked source files.'

      - name: Python syntax gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' pyfiles < <(find . -type f -name '*.py' -not -path './.pio/*' -not -path './.git/*' -print0)
          if [ ${#pyfiles[@]} -gt 0 ]; then
            python -m py_compile "${pyfiles[@]}"
          fi

      - name: Host regression simulations
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t sims < <(find . -maxdepth 2 -type f \( -name 'host_sim*.py' -o -name '*regression*.py' -o -name '*audit*.py' \) -not -path './.pio/*' -not -path './.git/*' | sort)
          if [ ${#sims[@]} -eq 0 ]; then
            echo 'No host regression simulation scripts found; gate is informational.'
            exit 0
          fi
          printf 'Running %s host simulation/regression scripts\n' "${#sims[@]}"
          for sim in "${sims[@]}"; do
            echo "===== $sim ====="
            python "$sim"
          done

      - name: Clean
        run: pio run -t clean

      - name: Build firmware - USB environment
        run: pio run -e lilygo_tcan485

      - name: Build firmware - OTA environment
        run: pio run -e lilygo_tcan485_ota

      - name: Build SPIFFS - USB environment
        run: pio run -e lilygo_tcan485 -t buildfs

      - name: Build SPIFFS - OTA environment
        run: pio run -e lilygo_tcan485_ota -t buildfs

      - name: Release artifact gate
        shell: bash
        run: |
          set -euo pipefail
          FW_VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('include/config.h').read_text(encoding='utf-8')
          m = re.search(r'^\s*#define\s+FW_VERSION\s+"([^"]+)"\s*$', text, re.M)
          if not m:
              raise SystemExit('FW_VERSION not found uniquely in include/config.h')
          print(m.group(1))
          PY
          )"
          for env in lilygo_tcan485 lilygo_tcan485_ota; do
            for f in firmware.bin spiffs.bin bootloader.bin partitions.bin; do
              test -s ".pio/build/$env/$f"
              echo "$env $f: $(stat -c%s ".pio/build/$env/$f") bytes"
            done
            grep -aFq 'fs_version.txt' ".pio/build/$env/spiffs.bin" || {
              echo "ERROR: $env/spiffs.bin does not contain fs_version.txt"; exit 1; }
            grep -aFq "$FW_VERSION" ".pio/build/$env/spiffs.bin" || {
              echo "ERROR: $env/spiffs.bin does not contain FW_VERSION=$FW_VERSION"; exit 1; }
          done
          cmp -s .pio/build/lilygo_tcan485/spiffs.bin .pio/build/lilygo_tcan485_ota/spiffs.bin || {
            echo 'ERROR: USB and OTA SPIFFS images differ.'; exit 1; }
          echo 'SPIFFS provenance OK: manifest present, FW_VERSION embedded, USB/OTA images identical.'

      - name: Collect build artifacts
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/lilygo_tcan485 artifacts/lilygo_tcan485_ota
          for env in lilygo_tcan485 lilygo_tcan485_ota; do
            cp ".pio/build/$env/firmware.bin" "artifacts/$env/"
            cp ".pio/build/$env/spiffs.bin" "artifacts/$env/"
            cp ".pio/build/$env/bootloader.bin" "artifacts/$env/"
            cp ".pio/build/$env/partitions.bin" "artifacts/$env/"
          done
          cp platformio.ini partitions.csv data/fs_version.txt artifacts/
          cat > artifacts/FLASH_USB.txt <<'EOF'
          EcoFlow LILYGO T-CAN485 - complete USB flash package

          Environment: lilygo_tcan485
          Flash layout:
            0x1000    bootloader.bin
            0x8000    partitions.bin
            0x10000   firmware.bin
            0x390000  spiffs.bin

          IMPORTANT:
          - Use the four files from artifacts/lilygo_tcan485/ together.
          - Do not mix files from different GitHub runs or environments.
          - fs_version.txt is included as provenance evidence.
          - A full-chip erase also removes NVS/settings. Do not erase unless intentionally doing a factory-clean flash.
          EOF

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EcoFlow-LILYGO-build-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
