name: 15AJ X509 Reason Diagnostic
on:
  push:
    branches: ["diag/15aj-x509-reason"]
  workflow_dispatch:

jobs:
  x509-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe live EcoFlow TLS chain with SNI
        run: |
          set -euo pipefail
          mkdir -p x509-artifacts
          echo | openssl s_client -connect api-e.ecoflow.com:443 -servername api-e.ecoflow.com -showcerts 2>&1 | tee x509-artifacts/s_client.txt
          awk '/-----BEGIN CERTIFICATE-----/{n++} n{print > ("x509-artifacts/cert" n ".pem")} /-----END CERTIFICATE-----/{close("x509-artifacts/cert" n ".pem")}' x509-artifacts/s_client.txt
          for f in x509-artifacts/cert*.pem; do
            echo "===== $f =====" | tee -a x509-artifacts/cert-summary.txt
            openssl x509 -in "$f" -noout -subject -issuer -serial -dates -fingerprint -sha256 -ext subjectAltName | tee -a x509-artifacts/cert-summary.txt
          done
      - name: Extract firmware DigiCert G2 trust anchor and verify live chain
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('src/powerstream_api.cpp').read_text()
          m=re.search(r'static const char ECOFLOW_CA_BUNDLE\[\].*?R"EOF\((.*?)\)EOF";',s,re.S)
          if not m: raise SystemExit('ECOFLOW_CA_BUNDLE not found')
          Path('x509-artifacts/firmware-ca.pem').write_text(m.group(1).strip()+"\n")
          PY
          openssl x509 -in x509-artifacts/firmware-ca.pem -noout -subject -issuer -dates -fingerprint -sha256 | tee x509-artifacts/firmware-ca-summary.txt
          # cert1 = leaf, cert2.. = server-supplied chain. Build untrusted intermediates only.
          rm -f x509-artifacts/intermediates.pem
          for f in x509-artifacts/cert*.pem; do
            [ "$f" = "x509-artifacts/cert1.pem" ] && continue
            cat "$f" >> x509-artifacts/intermediates.pem
          done
          if [ -s x509-artifacts/intermediates.pem ]; then
            openssl verify -verbose -show_chain -CAfile x509-artifacts/firmware-ca.pem -untrusted x509-artifacts/intermediates.pem -verify_hostname api-e.ecoflow.com x509-artifacts/cert1.pem | tee x509-artifacts/verify.txt
          else
            openssl verify -verbose -show_chain -CAfile x509-artifacts/firmware-ca.pem -verify_hostname api-e.ecoflow.com x509-artifacts/cert1.pem | tee x509-artifacts/verify.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: 15AJ-x509-live-chain-${{ github.sha }}
          path: x509-artifacts/
          retention-days: 14
