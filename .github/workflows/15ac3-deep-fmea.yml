name: 15AC3 deep lifecycle FMEA
on:
  push:
    branches: ["diag/9.36.7.15AC3-ble-ram-lifecycle"]
  workflow_dispatch:

jobs:
  deep-fmea:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Static ownership and lifecycle FMEA
        run: |
          python - <<'PY'
          from pathlib import Path
          rg=Path('src/resource_gate.cpp').read_text(errors='ignore')
          ble=Path('src/powerstream_ble_lab.cpp').read_text(errors='ignore')
          api=Path('src/powerstream_api.cpp').read_text(errors='ignore')
          # Audit the actual production transport function. It is named apiRequest,
          # and this diagnostic firmware rejects every method except GET at entry.
          req_start=api.index('static bool apiRequest(')
          # Bound the slice at the next public API function rather than attempting
          # to parse nested C++ braces with a first-"}" substring search.
          marker='bool powerStreamApiQueryQuota('
          req_end=api.index(marker,req_start) if marker in api[req_start:] else len(api)
          get_path=api[req_start:req_end]
          checks={
            'atomic owner CAS':'compare_exchange_strong' in rg,
            'release mismatch telemetry':'gHeavyReleaseMismatch' in rg,
            'owner age diagnostic only':'NEVER used to steal' in rg,
            'BLE runtime heap guard':'runtimeGuard(' in ble,
            'BLE heap integrity':'heap_caps_check_integrity_all' in ble,
            'BLE worker state':'sWorkerRunning' in ble,
            'BLE cleanup telemetry':'sCleanupCount' in ble and 'sCleanupDeltaFree' in ble,
            'cloud GET-only fail closed':'if(method!="GET")' in get_path,
            'cloud TLS CA installed':'setCACert(ECOFLOW_CA_BUNDLE)' in get_path,
            'cloud TLS no insecure fallback':'setInsecure' not in get_path,
            'TLS fragmentation preflight':'TLS_GET_MIN_LARGEST8' in get_path,
            'AC1 local access snapshot':'requestAccess=gAccess;' in api,
            'AC1 local secret snapshot':'requestSecret=gSecret;' in api,
            'AC1 HMAC local secret':'hmac256(signBase,requestSecret)' in api,
          }
          for k,v in checks.items(): print(('PASS' if v else 'FAIL'), k)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('15AC3 deep FMEA failed: '+', '.join(bad))
          print('15AC3 deep static FMEA PASS')
          PY
      - name: Resource gate model stress
        run: |
          python - <<'PY'
          owner=0; acquires=0; mismatch=0
          def acquire(wanted):
            global owner,acquires
            if wanted==0 or owner!=0:return False
            owner=wanted;acquires+=1;return True
          def release(wanted):
            global owner,mismatch
            if owner==wanted: owner=0
            elif wanted!=0:mismatch+=1
          for _ in range(10000):
            assert acquire(1); assert not acquire(2); release(1); assert owner==0
            assert acquire(2); assert not acquire(1); release(2); assert owner==0
          assert acquires==20000 and mismatch==0
          release(1); assert mismatch==1 and owner==0
          print('15AC3 owner stress PASS cycles=10000 acquires=',acquires,'intentional_mismatch=',mismatch)
          PY
      - name: Credential persistence gate
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/powerstream_api.cpp').read_text()
          a=s[s.index('static bool authHeaders('):s.index('\n}\n\nclass BoundedApiResponse',s.index('static bool authHeaders('))]
          assert a.count('gAccess')==1
          assert a.count('gSecret')==1
          assert 'hmac256(signBase,gSecret)' not in a
          assert 'http.addHeader("accessKey",gAccess)' not in a
          print('15AC3 AC1 persistence PASS')
          PY
      - name: Full clean USB
        run: pio run -e lilygo_tcan485 -t fullclean
      - name: Build USB
        run: pio run -e lilygo_tcan485
      - name: Build OTA
        run: pio run -e lilygo_tcan485_ota
      - name: Build SPIFFS USB
        run: pio run -e lilygo_tcan485 -t buildfs
      - name: Build SPIFFS OTA
        run: pio run -e lilygo_tcan485_ota -t buildfs
      - name: Collect deep-FMEA binaries
        run: |
          mkdir -p artifacts
          cp .pio/build/lilygo_tcan485/firmware.bin artifacts/firmware-usb.bin
          cp .pio/build/lilygo_tcan485/spiffs.bin artifacts/spiffs-usb.bin
          cp .pio/build/lilygo_tcan485_ota/firmware.bin artifacts/firmware-ota.bin
          cp .pio/build/lilygo_tcan485_ota/spiffs.bin artifacts/spiffs-ota.bin
      - uses: actions/upload-artifact@v4
        with:
          name: 15AC3-deep-fmea-build
          path: artifacts/
