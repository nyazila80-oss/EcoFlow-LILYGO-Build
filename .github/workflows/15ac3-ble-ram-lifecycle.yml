name: 15AC3 BLE RAM lifecycle
on:
  push:
    branches: ["diag/9.36.7.15AC3-ble-ram-lifecycle"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/9.36.7.15AC3-ble-ram-lifecycle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Ensure canonical AC1 source state
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('src/powerstream_api.cpp')
          s=p.read_text()
          start=s.index('static bool authHeaders(')
          end=s.index('\n}\n\nclass BoundedApiResponse',start)
          a=s[start:end]
          required=['String requestAccess;','String requestSecret;','requestAccess=gAccess;','requestSecret=gSecret;',
                    'hmac256(signBase,requestSecret)','http.addHeader("accessKey",requestAccess)','"accessKey="+requestAccess']
          canonical=all(x in a for x in required) and a.count('gAccess')==1 and a.count('gSecret')==1
          if canonical:
              print('Canonical AC1 source already persisted; generator not re-applied')
          else:
              print('Canonical AC1 source absent; applying generator once')
              subprocess.run(['python','tools/apply_15ac1_canonical_snapshot.py'],check=True)
          PY
      - name: Verify and persist canonical generated source
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/powerstream_api.cpp').read_text()
          a=s[s.index('static bool authHeaders('):s.index('\n}\n\nclass BoundedApiResponse',s.index('static bool authHeaders('))]
          required=['String requestAccess;','String requestSecret;','requestAccess=gAccess;','requestSecret=gSecret;',
                    'hmac256(signBase,requestSecret)','http.addHeader("accessKey",requestAccess)','"accessKey="+requestAccess']
          for token in required: assert token in a, token
          assert a.count('gAccess') == 1
          assert a.count('gSecret') == 1
          assert 'hmac256(signBase,gSecret)' not in a
          assert 'http.addHeader("accessKey",gAccess)' not in a
          print('15AC1 persisted-source gate PASS')
          PY
          if ! git diff --quiet -- src/powerstream_api.cpp tools/apply_tls15d_runtime_patch.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/powerstream_api.cpp tools/apply_tls15d_runtime_patch.py
            git commit -m "15AC3: persist canonical AC1 credential snapshot source"
            git push origin HEAD:diag/9.36.7.15AC3-ble-ram-lifecycle
          else
            echo 'Canonical AC1 source already persisted; no source mutation'
          fi
      - name: BLE RAM lifecycle source audit
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['src/powerstream_api.cpp','src/bms.cpp','src/main.cpp','src/web.cpp']
          text='\n'.join(Path(p).read_text(errors='ignore') for p in files if Path(p).exists())
          groups={
            'NimBLE lifecycle':['NimBLE','deinit','advertis'],
            'heap telemetry':['heap','largest'],
            'BLE/JK coexistence':['JK','BLE'],
            'ownership/admission':['heavy','owner','slot_ready'],
          }
          failed=[]; low=text.lower()
          for name,tokens in groups.items():
            hit=[t for t in tokens if t.lower() in low]
            print(name, 'tokens=', hit)
            if len(hit)<2: failed.append((name,hit))
          if failed: raise SystemExit('15AC3 source audit missing evidence: '+repr(failed))
          print('15AC3 BLE/RAM/lifecycle source audit PASS')
          PY
      - name: Full clean USB
        run: pio run -e lilygo_tcan485 -t fullclean
      - name: Build USB
        run: pio run -e lilygo_tcan485
      - name: Build OTA
        run: pio run -e lilygo_tcan485_ota
      - name: Build SPIFFS USB
        run: pio run -e lilygo_tcan485 -t buildfs
      - name: Build SPIFFS OTA
        run: pio run -e lilygo_tcan485_ota -t buildfs
      - name: Collect binaries
        run: |
          mkdir -p artifacts
          cp .pio/build/lilygo_tcan485/firmware.bin artifacts/firmware-usb.bin
          cp .pio/build/lilygo_tcan485/spiffs.bin artifacts/spiffs-usb.bin
          cp .pio/build/lilygo_tcan485_ota/firmware.bin artifacts/firmware-ota.bin
          cp .pio/build/lilygo_tcan485_ota/spiffs.bin artifacts/spiffs-ota.bin
      - uses: actions/upload-artifact@v4
        with:
          name: 15AC3-ble-ram-lifecycle-build
          path: artifacts/
