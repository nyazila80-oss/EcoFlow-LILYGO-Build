name: 15AF Full Build Gate
on:
  push:
    branches: ["diag/9.36.7.15AF-no-reservation-final"]
  workflow_dispatch:

jobs:
  full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Provenance
        run: |
          echo "15AF_HEAD=$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git log -1 --oneline
      - name: Python syntax gate
        run: python -m compileall -q tools
      - name: Install PlatformIO
        run: pip install platformio
      - name: Bootstrap pinned packages
        run: pio pkg install -e lilygo_tcan485
      - name: Security and 15AF composition audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          ini=Path('platformio.ini').read_text()
          src=Path('src/powerstream_api.cpp').read_text()
          assert 'platformio_tls15af_no_aux_reservation.py' in ini
          assert 'setCACert(ECOFLOW_CA_BUNDLE)' in src
          code=re.sub(r'//[^\n]*|/\*.*?\*/','',src,flags=re.S)
          assert not re.search(r'\bsetInsecure\s*\(',code)
          assert 'MBEDTLS_SSL_VERIFY_NONE' not in code
          print('SECURITY PASS: CA verification present; no executable insecure fallback')
          PY
      - name: Existing audits and host simulations
        run: |
          set -euo pipefail
          for f in tools/host_sim_*.py tools/audit_*.py; do
            echo "===== 15AF RUN $f ====="
            python "$f"
          done
      - name: Full clean USB
        run: pio run -e lilygo_tcan485 -t fullclean
      - name: Build USB
        run: pio run -e lilygo_tcan485
      - name: Build OTA
        run: pio run -e lilygo_tcan485_ota
      - name: Build SPIFFS USB
        run: pio run -e lilygo_tcan485 -t buildfs
      - name: Build SPIFFS OTA
        run: pio run -e lilygo_tcan485_ota -t buildfs
      - name: Verify generated 15AF target
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('src/powerstream_api.cpp').read_text()
          assert '9.36.7.15AF-NO-AUX-RESERVATION' in src
          assert 'setCACert(ECOFLOW_CA_BUNDLE)' in src
          code=re.sub(r'//[^\n]*|/\*.*?\*/','',src,flags=re.S)
          assert not re.search(r'\bsetInsecure\s*\(',code)
          assert 'MBEDTLS_SSL_VERIFY_NONE' not in code
          assert 'jkBleProxyReserveAuxConnection();' not in code
          print('15AF GENERATED TARGET PASS')
          PY
      - name: Collect original-name OTA artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp .pio/build/lilygo_tcan485_ota/firmware.bin artifacts/firmware.bin
          cp .pio/build/lilygo_tcan485_ota/spiffs.bin artifacts/spiffs.bin
          sha256sum artifacts/firmware.bin artifacts/spiffs.bin | tee artifacts/SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > artifacts/COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 15AF-original-files-${{ github.sha }}
          path: artifacts/
          retention-days: 14
