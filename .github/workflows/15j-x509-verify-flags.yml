name: 15J X509 Verify Flags Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build15j:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Apply complete 15J patch chain
        run: |
          set -euo pipefail
          python tools/run_tls15j_patch.py
          grep -F 'TLS15J_VERSION="9.36.7.15J-X509-VERIFY-FLAGS"' src/powerstream_api.cpp
          grep -F 'tls15j_verify_flags_raw' src/powerstream_api.cpp
          grep -F 'MBEDTLS_X509_BADCERT_NOT_TRUSTED' src/powerstream_api.cpp
          grep -F 'client.setCACert(ECOFLOW_CA_BUNDLE);' src/powerstream_api.cpp
          if grep -Ev '^[[:space:]]*(//|/\*|\*|#)' src/powerstream_api.cpp | grep -Eq '(^|[^[:alnum:]_])setInsecure[[:space:]]*\('; then
            echo 'ERROR: executable setInsecure() call detected'; exit 1
          fi
      - name: Provenance source gate
        run: |
          set -euo pipefail
          grep -F '#define FW_VERSION "2.4.5.9.36.7.15J-X509-VERIFY-FLAGS"' include/config.h
          test "$(tr -d '\r\n' < data/fs_version.txt)" = '2.4.5.9.36.7.15J-X509-VERIFY-FLAGS'
          grep -F 'extra_scripts = pre:tools/platformio_tls15j_framework_patch.py' platformio.ini
      - name: Python syntax
        run: python -m py_compile tools/*.py
      - name: Resolve PlatformIO packages before 15J framework patch
        run: |
          set -euo pipefail
          pio pkg install -e lilygo_tcan485
          test -f "$HOME/.platformio/packages/framework-arduinoespressif32/libraries/WiFiClientSecure/src/ssl_client.cpp"
          echo '15J framework package resolved before SCons extra script'
      - name: Clean and build firmware
        run: |
          set -euo pipefail
          pio run -t clean
          pio run -e lilygo_tcan485
          pio run -e lilygo_tcan485_ota
          pio run -e lilygo_tcan485 -t buildfs
          pio run -e lilygo_tcan485_ota -t buildfs
      - name: Binary provenance gate
        run: |
          set -euo pipefail
          for env in lilygo_tcan485 lilygo_tcan485_ota; do
            fw=.pio/build/$env/firmware.bin
            fs=.pio/build/$env/spiffs.bin
            test -s "$fw"; test -s "$fs"
            grep -aFq '9.36.7.15J-X509-VERIFY-FLAGS' "$fw"
            grep -aFq 'tls15j_verify_flags_raw' "$fw"
            grep -aFq '2.4.5.9.36.7.15J-X509-VERIFY-FLAGS' "$fs"
          done
          cmp -s .pio/build/lilygo_tcan485/spiffs.bin .pio/build/lilygo_tcan485_ota/spiffs.bin
          echo '15J binary provenance PASS'
      - name: Collect artifacts
        run: |
          mkdir -p artifacts/lilygo_tcan485 artifacts/lilygo_tcan485_ota
          for env in lilygo_tcan485 lilygo_tcan485_ota; do
            cp .pio/build/$env/firmware.bin artifacts/$env/
            cp .pio/build/$env/spiffs.bin artifacts/$env/
          done
          cp data/fs_version.txt artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: EcoFlow-LILYGO-15J-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
