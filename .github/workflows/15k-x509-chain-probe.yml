name: 15K X509 Chain Probe Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build15k:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Apply complete 15K patch chain
        run: |
          set -euo pipefail
          python tools/run_tls15k_patch.py
          grep -F 'tls15k_chain' src/powerstream_api.cpp
          grep -F 'client.setCACert(ECOFLOW_CA_BUNDLE);' src/powerstream_api.cpp
          if grep -Ev '^[[:space:]]*(//|/\*|\*|#)' src/powerstream_api.cpp | grep -Eq '(^|[^[:alnum:]_])setInsecure[[:space:]]*\('; then
            echo 'ERROR: executable setInsecure() call detected'; exit 1
          fi
      - name: Provenance source gate
        run: |
          set -euo pipefail
          grep -F '#define FW_VERSION "2.4.5.9.36.7.15K-X509-CHAIN-PROBE"' include/config.h
          test "$(tr -d '\r\n' < data/fs_version.txt)" = '2.4.5.9.36.7.15K-X509-CHAIN-PROBE'
      - name: Python syntax
        run: python -m py_compile tools/*.py
      - name: Resolve and PREPATCH framework before compile
        run: |
          set -euo pipefail
          pio pkg install -e lilygo_tcan485
          python tools/prepatch_tls15j_framework.py
          F="$HOME/.platformio/packages/framework-arduinoespressif32/libraries/WiFiClientSecure/src/ssl_client.cpp"
          grep -F 'tls15k_get_chain_sha256' "$F"
          grep -F 'mbedtls_x509_dn_gets' "$F"
          grep -F 'mbedtls_sha256_ret' "$F"
          grep -F 'MBEDTLS_SSL_VERIFY_REQUIRED' "$F"
      - name: Clean and build firmware
        run: |
          set -euo pipefail
          pio run -t clean
          pio run -e lilygo_tcan485
          pio run -e lilygo_tcan485_ota
          pio run -e lilygo_tcan485 -t buildfs
          pio run -e lilygo_tcan485_ota -t buildfs
      - name: Binary provenance gate
        run: |
          set -euo pipefail
          for env in lilygo_tcan485 lilygo_tcan485_ota; do
            fw=.pio/build/$env/firmware.bin
            fs=.pio/build/$env/spiffs.bin
            test -s "$fw"; test -s "$fs"
            grep -aFq '9.36.7.15K-X509-CHAIN-PROBE' "$fw"
            grep -aFq 'tls15k_chain' "$fw"
            grep -aFq '2.4.5.9.36.7.15K-X509-CHAIN-PROBE' "$fs"
          done
          cmp -s .pio/build/lilygo_tcan485/spiffs.bin .pio/build/lilygo_tcan485_ota/spiffs.bin
          echo '15K binary provenance PASS'
      - name: Collect artifacts
        run: |
          mkdir -p artifacts/lilygo_tcan485 artifacts/lilygo_tcan485_ota
          for env in lilygo_tcan485 lilygo_tcan485_ota; do
            cp .pio/build/$env/firmware.bin artifacts/$env/
            cp .pio/build/$env/spiffs.bin artifacts/$env/
          done
          cp data/fs_version.txt artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: EcoFlow-LILYGO-15K-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
