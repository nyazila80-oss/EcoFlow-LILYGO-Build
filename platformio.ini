; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lilygo_tcan485]
platform = espressif32@7.1.3
board = esp32doit-devkit-v1
framework = arduino
board_build.filesystem = spiffs
; 15J diagnostic-only framework hook: captures mbedTLS verify flags before
; WiFiClientSecure clears the failed TLS context. It never weakens verification.
extra_scripts = pre:tools/platformio_tls15j_framework_patch.py
; IMPORTANT: first migration to this custom partition table must be done once by USB
; using env:lilygo_tcan485. OTA cannot replace the flash partition table.
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_deps =
  esp32async/ESPAsyncWebServer @ 3.12.1
  ESP32Async/AsyncTCP @ 3.5.0
  knolleary/PubSubClient @ 2.8.0
  h2zero/NimBLE-Arduino @ 2.5.1
build_flags =
  -DPS_AUTH_V3_PROBE_ONLY=1
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
  -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=247
;upload_protocol = espota
;upload_port = 192.168.XXX.XXX

[env:lilygo_tcan485_ota]
extends = env:lilygo_tcan485
upload_protocol = espota
upload_port = 192.168.178.67
upload_flags =
    --auth=YOUR_OTA_PASSWORD

