; PlatformIO Project Configuration File
[env:lilygo_tcan485]
platform = espressif32@7.1.3
board = esp32doit-devkit-v1
framework = arduino
board_build.filesystem = spiffs
; 15AC2 stock-TLS A/B:
; Deliberately run the framework's stock WiFiClientSecure/mbedTLS verifier.
; No framework verification callback/probe is injected in this branch.
; Application-side RAM reclaim and passive AB8 admission telemetry stay enabled
; so the hardware result remains comparable without legacy crypto-probe anchors.
; Peer verification remains mandatory through WiFiClientSecure::setCACert();
; there is no setInsecure() fallback.
; Excluded intentionally:
; - 15Z hotpath relief: depends on removed verification instrumentation.
; - 15AB attribution: its JSON insertion depends on the removed 15Y trace.
; Both are diagnostic patchers, not required for TLS verification or AB8 safety.
extra_scripts =
  pre:tools/platformio_tls15z_memory_relief_ab.py
  pre:tools/platformio_tls15z_ab7_hardening.py
  pre:tools/platformio_tls15z_ab8_hardware_fix.py
  pre:tools/platformio_tls15z_ab8_admission_probe.py
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_deps =
  esp32async/ESPAsyncWebServer @ 3.12.1
  ESP32Async/AsyncTCP @ 3.5.0
  knolleary/PubSubClient @ 2.8.0
  h2zero/NimBLE-Arduino @ 2.5.1
build_flags =
  -DPS_AUTH_V3_PROBE_ONLY=1
  -DTLS15AC2_STOCK_VERIFY_AB=1
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
  -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=247

[env:lilygo_tcan485_ota]
extends = env:lilygo_tcan485
upload_protocol = espota
upload_port = 192.168.178.67
upload_flags =
    --auth=YOUR_OTA_PASSWORD
